name: "Stage 1 — Biome Check"
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  biome-check:
    name: "Biome — Formatting & Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
